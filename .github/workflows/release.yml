# Build the plugins and attach them to a release.
#
# One job per format, because they do not share a runner or a build command and
# a matrix over things that differ in every step is a matrix in name only.
# Today that is VST3 and CLAP on Windows and Linux, the standalone instrument on
# Windows and Linux, and the Audio Unit on macOS.
#
# The two jobs look alike and are not the same. A VST3 is one self-contained
# bundle; a CLAP on Windows is a bare file that has to travel with a folder
# beside it, so what each one checks for and what each one zips differ.
#
# Assets are named `Quesynth-<version>-<format>-<platform>.zip` so a release
# page with three of them reads unambiguously, and so adding the second and
# third changes nothing about the first.
name: release

on:
  release:
    types: [published]
  # So the build can be exercised without cutting a release. On this path the
  # bundle is uploaded as a workflow artifact and nothing is attached anywhere.
  workflow_dispatch:

# Needed to attach an asset to the release. Read-only would build the plugin and
# then fail at the last step, which is the least useful place to find out.
permissions:
  contents: write

jobs:
  vst3-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The same version the engine is developed against; see the note in
      # pages.yml on why this pin follows the development machine.
      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-09

      # The suites run before the build, not after. A release that ships a
      # plugin whose DSP tests fail is worse than a release that does not
      # happen.
      - name: Test
        run: |
          odin test tests/dsp
          odin test tests/clap
          odin test tests/patch
          odin test tests/panel
          odin test tests/vst3

      # The same script a developer runs. tools/install-vst3.ps1 is local
      # convenience that calls this and then copies the result into a VST3
      # folder; what is published here is that bundle, zipped. An artifact laid
      # out only by CI is one nobody has ever actually run.
      - name: Build the bundle
        shell: pwsh
        run: pwsh tools/build-vst3.ps1 -Output build/stage

      - name: Check the bundle is complete
        shell: pwsh
        run: |
          $ui = "build/stage/Quesynth.vst3/Contents/Resources/ui"
          $bin = "build/stage/Quesynth.vst3/Contents/x86_64-win"
          $required = @(
            "$bin/Quesynth.vst3", "$bin/WebView2Loader.dll",
            "$ui/index.html", "$ui/app.js", "$ui/params.js", "$ui/bank.js",
            "$ui/patchfile.js", "$ui/sy1.js", "$ui/style.css",
            "$ui/modal.js", "$ui/browser.js",
            "$ui/midimap.js", "$ui/options.js"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "the bundle is missing: $($missing -join ', ')" }
          # bank.js existing is not the same as bank.js having anything in it,
          # and the panel asks for it behind an onerror guard -- so an empty one
          # would ship silently as a plugin with no sounds.
          $count = ([regex]::Matches((Get-Content "$ui/bank.js" -Raw), 'n:"')).Count
          if ($count -lt 1) { throw "the generated patch bank is empty" }
          Write-Host "bundle complete, $count patches in the bank"

      # What to do with the thing once it is downloaded. Obvious to anyone who
      # has installed a plugin before and a dead end for everyone else, and the
      # WebView2 note saves the one support question this plugin can generate.
      - name: Write the install note
        shell: pwsh
        run: |
          @"
          Quesynth -- VST3 for Windows (64-bit)

          To install, copy the folder

              Quesynth.vst3

          into your VST3 directory, which is normally

              C:\Program Files\Common Files\VST3

          then rescan plugins in your DAW. Quesynth appears as an instrument.

          The whole folder is the plugin: the interface lives inside it under
          Contents\Resources\ui, so copying only the .vst3 file out of it gives
          you an instrument that plays and shows the host's generic controls
          instead of its own panel.

          The editor needs the Microsoft Edge WebView2 runtime, which is already
          present on current Windows. Without it the plugin still loads and
          plays; only the panel is missing.

          This is experimental software. Please read the disclaimer:
          https://github.com/mauro-moreno/quesynth
          "@ | Out-File -FilePath build/stage/INSTALL.txt -Encoding utf8

      - name: Zip
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $asset = "Quesynth-$version-vst3-win64.zip"
          Compress-Archive -Path build/stage/Quesynth.vst3, build/stage/INSTALL.txt -DestinationPath $asset
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Kept either way, so a workflow_dispatch run produces something to
      # download and a release run still has the file if the upload is retried.
      - uses: actions/upload-artifact@v4
        with:
          name: vst3-win64
          path: ${{ env.ASSET }}

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$env:ASSET" --clobber

  clap-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-09

      # Before the build, for the reason the VST3 job gives.
      - name: Test
        run: |
          odin test tests/dsp
          odin test tests/clap
          odin test tests/patch
          odin test tests/panel
          odin test tests/vst3

      - name: Build
        shell: pwsh
        run: pwsh tools/build-clap.ps1 -Output build/clap-stage

      - name: Check it is complete
        shell: pwsh
        run: |
          $stage = "build/clap-stage"
          $ui = "$stage/Quesynth-ui"
          $required = @(
            "$stage/Quesynth.clap", "$stage/WebView2Loader.dll",
            "$ui/index.html", "$ui/app.js", "$ui/params.js", "$ui/bank.js",
            "$ui/patchfile.js", "$ui/sy1.js", "$ui/style.css",
            "$ui/modal.js", "$ui/browser.js", "$ui/midimap.js", "$ui/options.js"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "the build is missing: $($missing -join ', ')" }
          # bank.js existing is not the same as bank.js having anything in it.
          $count = ([regex]::Matches((Get-Content "$ui/bank.js" -Raw), 'n:"')).Count
          if ($count -lt 1) { throw "the generated patch bank is empty" }
          Write-Host "build complete, $count patches in the bank"

      # Where the three files go, and why all three. A .clap on its own loads
      # and plays; it just shows the host's generic controls, because the panel
      # it looks for is not beside it.
      - name: Write the install note
        shell: pwsh
        run: |
          @"
          Quesynth -- CLAP for Windows (64-bit)

          To install, copy all three of

              Quesynth.clap
              Quesynth-ui\
              WebView2Loader.dll

          into your CLAP directory, which is normally

              C:\Program Files\Common Files\CLAP

          then rescan plugins in your DAW. Quesynth appears as an instrument.

          All three, not just the .clap. Unlike a VST3 there is no bundle to put
          them in: the plugin looks for its interface in the folder beside it,
          and copying the .clap alone gives you an instrument that plays and
          shows the host's generic controls instead of its own panel.

          The editor needs the Microsoft Edge WebView2 runtime, which is already
          present on current Windows. Without it the plugin still loads and
          plays; only the panel is missing.

          This is experimental software. Please read the disclaimer:
          https://github.com/mauro-moreno/quesynth
          "@ | Out-File -FilePath build/clap-stage/INSTALL.txt -Encoding utf8

      - name: Zip
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $asset = "Quesynth-$version-clap-win64.zip"
          Compress-Archive -Path build/clap-stage/* -DestinationPath $asset
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: clap-win64
          path: ${{ env.ASSET }}

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$env:ASSET" --clobber

  standalone-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-09

      # The suites the standalone actually links: the engine and the patch layer.
      # It has no plugin wrapper and no panel, so the format-specific suites are
      # not what would break it.
      - name: Test
        run: |
          odin test tests/dsp
          odin test tests/patch

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/stage | Out-Null
          odin build hosts/standalone -o:speed -out:build/stage/quesynth.exe

      # It renders before it ships. --selftest opens no device, so the build
      # server can prove the engine produces finite samples without any audio
      # hardware -- the same gate the other formats get from their host checks.
      - name: It renders
        shell: pwsh
        run: |
          ./build/stage/quesynth.exe --selftest tools/s1probe/fixtures/unison-four.sy1 build/stage/selftest.wav
          if ($LASTEXITCODE -ne 0) { throw "the render self-test failed" }
          Remove-Item build/stage/selftest.wav

      - name: Write the install note
        shell: pwsh
        run: |
          @"
          Quesynth -- standalone instrument for Windows (64-bit)

          This is a console program, not a plugin. Open a terminal in this folder
          and run

              quesynth.exe                 play live, output through WASAPI
              quesynth.exe patch.sy1       load a Synth1 .sy1 patch and play it

          It opens every MIDI input it finds, so a connected controller plays it;
          with none attached it still runs, there is just nothing to play it with.
          Press Ctrl-C to stop.

          There is no panel: the standalone is the audio engine and MIDI, and the
          interface is a plugin and browser feature.

          This is experimental software. Please read the disclaimer:
          https://github.com/mauro-moreno/quesynth
          "@ | Out-File -FilePath build/stage/INSTALL.txt -Encoding utf8

      - name: Zip
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $asset = "Quesynth-$version-standalone-win64.zip"
          Compress-Archive -Path build/stage/quesynth.exe, build/stage/INSTALL.txt -DestinationPath $asset
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-win64
          path: ${{ env.ASSET }}

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$env:ASSET" --clobber

  standalone-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-09

      - name: Test
        run: |
          odin test tests/dsp
          odin test tests/patch

      - name: Build
        run: |
          mkdir -p build/stage
          odin build hosts/standalone -o:speed -out:build/stage/quesynth

      # As on Windows, it renders before it ships. libasound is loaded at run
      # time and --selftest never opens a device, so this needs neither the -dev
      # package nor any sound server on the runner.
      - name: It renders
        run: ./build/stage/quesynth --selftest tools/s1probe/fixtures/unison-four.sy1 build/stage/selftest.wav

      - name: Write the install note
        run: |
          cat > build/stage/INSTALL.txt <<'EOF'
          Quesynth -- standalone instrument for Linux (64-bit)

          This is a terminal program, not a plugin. Make it executable and run it:

              chmod +x quesynth
              ./quesynth                 play live, output through ALSA
              ./quesynth patch.sy1       load a Synth1 .sy1 patch and play it

          Audio goes through ALSA (libasound.so.2), which ships with essentially
          every Linux desktop and also reaches a PipeWire or PulseAudio server, so
          the default device is whatever you already hear sound through. It opens
          every hardware MIDI input it finds; press Ctrl-C to stop.

          There is no panel: the standalone is the audio engine and MIDI, and the
          interface is a plugin and browser feature.

          This is experimental software. Please read the disclaimer:
          https://github.com/mauro-moreno/quesynth
          EOF

      - name: Zip
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          asset="Quesynth-$version-standalone-linux64.zip"
          zip -j "$asset" build/stage/quesynth build/stage/INSTALL.txt
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-linux64
          path: ${{ env.ASSET }}

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ASSET" --clobber

  vst3-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-09

      - name: Test
        run: |
          odin test tests/dsp
          odin test tests/patch

      # The same script a developer runs locally, so the artifact is the one that
      # was tested. It assembles the bundle: the .so under Contents/x86_64-linux
      # and the panel under Contents/Resources/ui, with the bank generated in.
      - name: Build the bundle
        run: |
          mkdir -p build
          bash tools/build-vst3.sh build/stage

      - name: Check the bundle is complete
        run: |
          bin="build/stage/Quesynth.vst3/Contents/x86_64-linux"
          ui="build/stage/Quesynth.vst3/Contents/Resources/ui"
          for f in "$bin/Quesynth.so" \
                   "$ui/index.html" "$ui/app.js" "$ui/params.js" "$ui/bank.js" \
                   "$ui/style.css" "$ui/bridge.js" "$ui/layout.js" \
                   "$ui/modal.js" "$ui/browser.js" "$ui/midimap.js" "$ui/options.js"; do
            [ -f "$f" ] || { echo "the bundle is missing: $f"; exit 1; }
          done
          # bank.js existing is not bank.js having anything in it, and the panel
          # asks for it behind an onerror guard -- an empty one would ship silently.
          count=$(grep -o 'n:"' "$ui/bank.js" | wc -l)
          [ "$count" -ge 1 ] || { echo "the generated patch bank is empty"; exit 1; }
          echo "bundle complete, $count patches in the bank"

      - name: Write the install note
        run: |
          cat > build/stage/INSTALL.txt <<'EOF'
          Quesynth -- VST3 for Linux (64-bit)

          To install, copy the folder

              Quesynth.vst3

          into your VST3 directory, which is normally

              ~/.vst3            (just for you)
              /usr/lib/vst3      (for everyone)

          then rescan plugins in your DAW. Quesynth appears as an instrument.

          The whole folder is the plugin: the interface lives inside it under
          Contents/Resources/ui, so copying only the .so out of it gives you an
          instrument that plays and shows the host's generic controls instead of
          its own panel.

          The editor is drawn by WebKitGTK (GTK 3), loaded at run time; it is
          present on essentially every desktop. Without it -- or in a host built
          on GTK 2, such as Ardour, which cannot share a process with GTK 3 -- the
          plugin still loads and plays, and the host draws its own controls.

          This is experimental software. Please read the disclaimer:
          https://github.com/mauro-moreno/quesynth
          EOF

      - name: Zip
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          asset="Quesynth-$version-vst3-linux64.zip"
          ( cd build/stage && zip -r "$OLDPWD/$asset" Quesynth.vst3 INSTALL.txt >/dev/null )
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: vst3-linux64
          path: ${{ env.ASSET }}

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ASSET" --clobber

  clap-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-09

      - name: Test
        run: |
          odin test tests/dsp
          odin test tests/patch

      - name: Build
        run: |
          mkdir -p build
          bash tools/build-clap.sh build/clap-stage

      - name: Check it is complete
        run: |
          stage="build/clap-stage"
          ui="$stage/Quesynth-ui"
          for f in "$stage/Quesynth.clap" \
                   "$ui/index.html" "$ui/app.js" "$ui/params.js" "$ui/bank.js" \
                   "$ui/style.css" "$ui/bridge.js" "$ui/layout.js" \
                   "$ui/modal.js" "$ui/browser.js" "$ui/midimap.js" "$ui/options.js"; do
            [ -f "$f" ] || { echo "the build is missing: $f"; exit 1; }
          done
          count=$(grep -o 'n:"' "$ui/bank.js" | wc -l)
          [ "$count" -ge 1 ] || { echo "the generated patch bank is empty"; exit 1; }
          echo "build complete, $count patches in the bank"

      # The CLAP is then driven by tools/clapprobe, which loads it, instantiates
      # it and activates it -- proof a host can open what is about to ship, which
      # a build alone does not give.
      - name: A host can load it
        run: |
          odin build tools/clapprobe -out:build/clapprobe
          ./build/clapprobe build/clap-stage/Quesynth.clap

      - name: Write the install note
        run: |
          cat > build/clap-stage/INSTALL.txt <<'EOF'
          Quesynth -- CLAP for Linux (64-bit)

          To install, copy both of

              Quesynth.clap
              Quesynth-ui/

          into your CLAP directory, which is normally

              ~/.clap            (just for you)
              /usr/lib/clap      (for everyone)

          then rescan plugins in your DAW. Quesynth appears as an instrument.

          Both, not just the .clap. Unlike a VST3 there is no bundle to put them
          in: the plugin looks for its interface in the Quesynth-ui folder beside
          it, and copying the .clap alone gives you an instrument that plays and
          shows the host's generic controls instead of its own panel.

          The editor is drawn by WebKitGTK (GTK 3), loaded at run time; it is
          present on essentially every desktop. Without it -- or in a host built
          on GTK 2, such as Ardour, which cannot share a process with GTK 3 -- the
          plugin still loads and plays, and the host draws its own controls.

          This is experimental software. Please read the disclaimer:
          https://github.com/mauro-moreno/quesynth
          EOF

      - name: Zip
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          asset="Quesynth-$version-clap-linux64.zip"
          ( cd build/clap-stage && zip -r "$OLDPWD/$asset" Quesynth.clap Quesynth-ui INSTALL.txt >/dev/null )
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: clap-linux64
          path: ${{ env.ASSET }}

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ASSET" --clobber

  au-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-09

      - name: Test
        run: |
          odin test tests/dsp
          odin test tests/patch

      # Assemble the .component (build-au.sh makes the native arm64 slice and the
      # Info.plist), then add the x86_64 slice and lipo the two into one universal
      # binary, so the release runs on both Apple Silicon and Intel.
      - name: Build the bundle (universal)
        run: |
          mkdir -p build
          bash tools/build-au.sh build/au-stage
          bin="build/au-stage/Quesynth.component/Contents/MacOS/Quesynth"
          odin build hosts/au -build-mode:dll -target:darwin_amd64 -o:speed -out:build/au-x86.dylib
          lipo -create "$bin" build/au-x86.dylib -output build/au-universal
          mv build/au-universal "$bin"
          lipo -info "$bin"

      # It validates before it ships. auval instantiates the unit and exercises
      # its parameters, state, presets and render; a release that ships an AU that
      # fails validation is worse than a release that does not happen. The same
      # install/sign/register dance the ci workflow uses.
      - name: Validate (auval)
        run: |
          dest="/Library/Audio/Plug-Ins/Components"
          sudo mkdir -p "$dest"
          sudo rm -rf "$dest/Quesynth.component"
          sudo cp -R build/au-stage/Quesynth.component "$dest/"
          sudo codesign --force --sign - "$dest/Quesynth.component/Contents/MacOS/Quesynth"
          sudo codesign --force --sign - "$dest/Quesynth.component"
          sudo killall -9 coreaudiod AudioComponentRegistrar 2>/dev/null || true
          found=0
          for i in $(seq 1 20); do
            if auval -a 2>/dev/null | grep -qi 'Qsy1'; then found=1; break; fi
            sleep 3
          done
          [ "$found" = 1 ] || { echo "the Audio Unit did not register for validation"; exit 1; }
          auval -v aumu Qsy1 QSYT

      # Ad-hoc sign what ships, so the component loads once its quarantine flag is
      # cleared. It is not notarized; the note says how to clear quarantine.
      - name: Sign the shipped bundle
        run: |
          bin="build/au-stage/Quesynth.component/Contents/MacOS/Quesynth"
          codesign --force --sign - "$bin"
          codesign --force --sign - "build/au-stage/Quesynth.component"

      - name: Write the install note
        run: |
          cat > build/au-stage/INSTALL.txt <<'EOF'
          Quesynth -- Audio Unit (AUv2) for macOS, universal (Apple Silicon + Intel)

          To install, copy the folder

              Quesynth.component

          into your Audio Unit directory, which is

              ~/Library/Audio/Plug-Ins/Components     (just you)
              /Library/Audio/Plug-Ins/Components      (everyone)

          then relaunch your host. Quesynth appears as an instrument (aumu Qsy1 QSYT)
          in Logic, GarageBand, and other AU hosts.

          It is ad-hoc signed, not notarized. If macOS refuses to load it, clear the
          quarantine flag it was downloaded with:

              xattr -dr com.apple.quarantine Quesynth.component

          This build has no custom editor yet: the host draws its own generic
          controls. The audio engine, parameters and MIDI are the plugin.

          This is experimental software. Please read the disclaimer:
          https://github.com/mauro-moreno/quesynth
          EOF

      - name: Zip
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          asset="Quesynth-$version-au-macos.zip"
          ( cd build/au-stage && zip -r -y "$OLDPWD/$asset" Quesynth.component INSTALL.txt >/dev/null )
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: au-macos
          path: ${{ env.ASSET }}

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ASSET" --clobber
