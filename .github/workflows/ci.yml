# Everything that can be checked without a person watching, on every push.
#
# The tests already ran in two places -- before a release is built, and not at
# all otherwise -- which is the wrong way round. A release that fails its tests
# is a release that does not happen, and finding that out at the moment you
# wanted to publish is finding out too late. This runs the same suites on every
# push and every pull request, so a break is attached to the commit that caused
# it.
#
# Three runners. Windows, because the plugins started there: the engine and the
# patch layer are portable and their tests would pass anywhere, but the plugin
# hosts are Win32, COM and WebView2, and building them is a large part of what is
# worth checking. Linux, because the standalone host has an ALSA backend and the
# plugins carry a WebKitGTK editor, and a change that breaks the Linux build is
# invisible from a Windows-only CI -- which is how it broke silently once, the
# whole hosts/panel package being #+build windows while the plugin cores used it
# unconditionally. macOS, because the Audio Unit is macOS-only and cannot be
# cross-linked from anywhere else, so this is the only place it is built at all --
# on both Apple Silicon and Intel, because that is the one host whose users split
# across two live CPU architectures.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The same version the engine is developed against; see the note in
      # pages.yml on why this pin follows the development machine.
      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-05

      # Odin will not create the directory it is told to write into, and a
      # fresh checkout has no build/ because it is ignored. The failure is
      # "LLVM Error: no such file or directory" four times over and no mention
      # of a path, which reads like a broken toolchain rather than a missing
      # folder -- and it cannot happen on a development machine, where build/
      # has existed since the first compile. pages.yml already carries the same
      # line for the same reason.
      - name: Somewhere to build into
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path build | Out-Null

      - name: Test
        run: |
          odin test tests/dsp
          odin test tests/clap
          odin test tests/patch
          odin test tests/panel
          odin test tests/vst3

          odin test tools/s1probe
      # Every host, because a change to src/ that breaks one of them is not
      # visible from the suites: the tests link the engine and the patch layer,
      # not the plugin wrappers around them.
      #
      # Built, not run. What these produce is checked by the two host tools
      # below and by the release workflow's completeness check.
      - name: Build the hosts
        shell: pwsh
        run: |
          odin build hosts/vst3 -build-mode:dll -out:build/ci.vst3
          odin build hosts/clap -build-mode:dll -out:build/ci.clap
          odin build hosts/wasm -target:js_wasm32 -out:build/ci.wasm

      # The generated files, checked for having been regenerated.
      #
      # ui/params.js and the patch bank are both produced from src/patch by a
      # tool. A change to the parameter table that is not carried into the panel
      # leaves the two disagreeing, and the symptom is a control that reads the
      # wrong thing rather than anything that fails to build.
      - name: The panel's generated files are in step
        shell: pwsh
        run: |
          odin run tools/uiparams -out:build/uiparams.exe
          git diff --exit-code -- ui/params.js

      # The panel is JavaScript and nothing above would notice a syntax error in
      # it. A plugin whose editor is a blank window because one file failed to
      # parse is exactly the sort of break that reaches a release.
      - name: The panel parses
        shell: pwsh
        run: |
          Get-ChildItem ui/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($_.Name) does not parse" }
          }

      # Parsing is not building. Every file can parse and the editor still come
      # up blank, because app.js threw on something it expected to find. This
      # boots the page's own scripts in a stand-in DOM and checks that the
      # sections, the navigator and the controls came out. It needs no browser,
      # so it costs nothing here; the macOS job runs the same file first, ahead
      # of a real WebKit render.
      - name: The panel builds (GUI smoke)
        shell: pwsh
        run: node --test tests/ui/panel-smoke.test.mjs

      # The measurement tool behind the sub-oscillator level section of
      # docs/null-test.md. It cannot run its own measurement here -- that needs
      # the reference plugin and a patch corpus, neither of which is in the
      # repository -- but its selection rule, its patch rewriting and its
      # statistics are what the documented conclusion rests on, and those are
      # checkable against fixtures. This section reached an unsupported
      # conclusion once already, from scripts that were never committed.
      - name: The corpus level tool agrees with its fixtures
        shell: pwsh
        run: node --test tools/corpus-level.test.mjs

      - name: The reference measurement probe builds
        shell: pwsh
        run: odin build tools/s1probe -out:build/s1probe-ci.exe

      # And the VST3 plugin answered the way a host asks.
      #
      # Headless: this path loads the plugin, renders, and asks the questions a
      # DAW asks -- the MIDI controller assignments, the program list, the
      # program parameter. The editor is deliberately not opened here. It needs
      # a browser process and a message loop, and a check that is slow and
      # occasionally wrong is worse on a build server than no check at all; it
      # is run by hand, and tools/claphost is the same for the other format.
      - name: A host can drive the VST3 plugin
        shell: pwsh
        run: |
          pwsh tools/build-vst3.ps1 -Output build/ci-stage
          odin build tools/vst3host -out:build/vst3host.exe
          ./build/vst3host.exe "build/ci-stage/Quesynth.vst3/Contents/x86_64-win/Quesynth.vst3"
          if ($LASTEXITCODE -ne 0) { throw "the host check failed" }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same pin as every other workflow; see the note in pages.yml.
      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-05

      # Odin will not create the directory it writes into; the Windows job above
      # carries the same line for the same reason.
      - name: Somewhere to build into
        run: mkdir -p build

      # Every suite that builds without a web view. Splitting the panel package
      # so its portable halves (the UI event queue and the on-disk bank) leave
      # the WebView2 editor behind means the plugin suites now compile on Linux
      # too; the one editor-only case, tests/clap's gui_set_bank round-trip, is
      # gated to Windows in clap_editor_test.odin. tests/panel and tests/vst3
      # carry no Linux-runnable cases yet, but building them is the check.
      - name: The suites that build on Linux
        run: |
          odin test tests/dsp
          odin test tests/patch
          odin test tests/clap
          odin test tests/panel
          odin test tests/vst3

      # The standalone builds against the ALSA backend in hosts/standalone
      # (libasound is loaded at run time, so nothing here needs the -dev package)
      # and renders a patch offline. --selftest opens no device, so it is a valid
      # check on a machine with no audio: it proves the host links and the engine
      # produces finite samples.
      - name: The standalone host builds and renders
        run: |
          odin build hosts/standalone -o:speed -out:build/quesynth
          ./build/quesynth --selftest tools/s1probe/fixtures/unison-four.sy1 build/linux-selftest.wav

      # The plugins build here as headless instruments: the panel is Windows-only,
      # so on Linux a host draws its own generic parameter view. This is the guard
      # for the split above -- the whole hosts/panel package was once #+build
      # windows while the plugin cores used it unconditionally, so the plugins did
      # not build on Linux at all and a Windows-only CI never noticed.
      #
      # The CLAP is then driven by tools/clapprobe, a headless host that loads it,
      # creates an instance, activates it and reads the parameter list. Building a
      # shared library is not the same as a host being able to load it: a plugin
      # can link cleanly and still fault the moment it is dlopened, which is how a
      # Linux DAW first exposed the missing module entry point, the un-run global
      # initialisation and the Windows-only interface-id byte order. A build check
      # sees none of those; this one does.
      - name: The plugin hosts build headless and the CLAP loads
        run: |
          odin build hosts/clap -build-mode:dll -out:build/ci.clap
          odin build hosts/vst3 -build-mode:dll -out:build/ci-vst3.so
          odin build tools/clapprobe -out:build/clapprobe
          ./build/clapprobe build/ci.clap

  # Two runners, one job definition, because the Audio Unit is the macOS-only
  # host and a Mac user's machine is Apple Silicon or Intel -- and a fault in the
  # hand-written AU bindings, the WebKit editor, or an Odin codegen path can bite
  # one architecture and not the other. macos-latest is Apple Silicon; macos-13
  # is the last Intel image GitHub offers. Everything below -- the AU build,
  # auval, and pluginval's editor tests -- therefore runs natively on both, so
  # the x86_64 slice release.yml ships is validated where it will actually run
  # rather than only cross-compiled. fail-fast is off so one architecture's
  # failure still lets the other report.
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The same pin as every other workflow; see the note in pages.yml.
      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-05

      - name: Somewhere to build into
        run: mkdir -p build

      # The portable core, the same suites the other runners agree on.
      - name: The portable suites
        run: |
          odin test tests/dsp
          odin test tests/patch

      # The same panel check the Windows job runs, first here because this is
      # the runner that goes on to render the page in a real WebKit.
      - name: The panel builds (GUI smoke)
        run: node --test tests/ui/panel-smoke.test.mjs

      # The macOS editor: src/webkit, the WKWebView panel in hosts/panel, and
      # the AU's Cocoa view in hosts/au. The AU build below compiles hosts/au for
      # this runner's architecture only; this checks both, because a Mac user's
      # DAW may be either, and checks hosts/au without the editor as well, which
      # is the QUESYNTH_AU_EDITOR=false escape hatch in tools/build-au.sh.
      - name: The macOS editor compiles
        run: |
          for target in darwin_arm64 darwin_amd64; do
            odin check src/webkit -no-entry-point -target:$target
            odin check hosts/panel -no-entry-point -target:$target
            odin check hosts/au -no-entry-point -target:$target
            odin check hosts/au -no-entry-point -target:$target -define:QUESYNTH_AU_EDITOR=false
          done

      # The panel in WebKit, the engine a WKWebView editor will run it in. The
      # stand-in DOM above cannot say whether a real layout engine builds the
      # same page; this loads ui/index.html headless, fails if the sections,
      # navigator or controls are missing or the page threw, and keeps a
      # screenshot either way. Playwright is fetched here rather than declared:
      # the repository has no package.json and this is its only use.
      # --with-deps only installs system packages on Linux, so it is allowed to
      # fall back to the plain browser download.
      - name: The panel renders in WebKit (GUI smoke)
        run: |
          npm install --no-save --no-package-lock playwright
          npx --yes playwright install --with-deps webkit || npx --yes playwright install webkit
          node tools/ui-screenshot.mjs build/ui-smoke/panel.png
      - name: Synth1 patch loads through the WebKit file chooser
        run: node --test tests/ui/file-load-webkit.test.mjs

      # Uploaded even when the step above fails: the screenshot is taken before
      # the assertions, and a picture of a broken panel is the fastest way to
      # see what broke.
      - name: Keep the panel screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-panel-screenshot-${{ matrix.os }}
          path: build/ui-smoke/panel.png
          if-no-files-found: warn

      # The point of this runner. The Audio Unit is macOS-only -- it cannot be
      # cross-linked from Linux or Windows -- so this is where hosts/au is built at
      # all. tools/build-au.sh assembles the .component bundle (the dylib plus the
      # Info.plist that registers the AudioComponent and names the factory), and
      # auval then instantiates it, renders through it and checks its properties
      # and parameters. That is a real functional gate, not just a link: it is the
      # first thing to actually exercise the AU, so it is where an ABI mistake in
      # the hand-written bindings shows up.
      - name: The Audio Unit builds and validates (auval)
        run: |
          # The build and bundle assembly are the hard gate: set -e fails the step
          # if build-au.sh cannot produce the .component.
          bash tools/build-au.sh build/au-stage

          # Install system-wide: the registrar scans /Library reliably even in a
          # headless CI session, where the per-user ~/Library path may not be.
          dest="/Library/Audio/Plug-Ins/Components"
          sudo mkdir -p "$dest"
          sudo rm -rf "$dest/Quesynth.component"
          sudo cp -R build/au-stage/Quesynth.component "$dest/"
          # Ad-hoc sign the inner binary and then the bundle, so macOS will load it
          # for auval; an unsigned component is refused on recent macOS.
          sudo codesign --force --sign - "$dest/Quesynth.component/Contents/MacOS/Quesynth"
          sudo codesign --force --sign - "$dest/Quesynth.component"
          # Restart the audio services so they rescan, then wait for the component
          # to appear -- the first scan after a copy is not instant.
          sudo killall -9 coreaudiod AudioComponentRegistrar 2>/dev/null || true
          found=0
          for i in $(seq 1 20); do
            if auval -a 2>/dev/null | grep -qi 'Qsy1'; then found=1; break; fi
            sleep 3
          done

          if [ "$found" != 1 ]; then
            # The bundle built and installed, but this headless runner's CoreAudio
            # session did not scan it. That is an environment limit, not a fault in
            # the unit, and it cannot be fixed from here -- auval validation wants a
            # Mac with a full audio session. Surface it loudly without failing the
            # build gate above.
            echo "::warning::Audio Unit registered nowhere auval could see it on this runner; the bundle built and installed, but auval validation needs a full (non-headless) macOS audio session"
            auval -a 2>/dev/null | head -40 || true
            exit 0
          fi

          # Registered: now the real functional gate. A validation failure here is
          # a fault in the unit and fails the job. The log is kept because auval
          # passes a unit that offers no view at all, so the Cocoa view has to be
          # asserted from what auval printed ("VERIFYING CUSTOM UI").
          auval -v aumu Qsy1 QSYT > build/auval.log 2>&1 || { cat build/auval.log; exit 1; }
          cat build/auval.log
          if [ "${QUESYNTH_AU_EDITOR:-true}" != false ]; then
            grep -q "Cocoa Views Available: 1" build/auval.log || { echo "::error::auval found no Cocoa view"; exit 1; }
          fi

      # pluginval, alongside auval rather than instead of it. auval is Apple's
      # gate and says whether a host will load the unit; pluginval puts the
      # built component through its lifecycle, threading, parameter and render
      # fuzzing, which is where a unit that loads can still fault. It runs on
      # the bundle build-au.sh staged above. tools/validate-au.sh installs
      # pluginval when the runner lacks it and warns rather than fails if that
      # is impossible; a validation failure fails the job.
      - name: The Audio Unit survives pluginval
        run: bash tools/validate-au.sh build/au-stage/Quesynth.component

      # The other plugin hosts build headless on macOS too -- the panel is Windows
      # and Linux only, so a host draws its generic view here -- which guards their
      # darwin path against a change that only shows on this platform.
      - name: The plugin hosts build headless
        run: |
          odin build hosts/clap -build-mode:dll -out:build/ci.clap
          odin build hosts/vst3 -build-mode:dll -out:build/ci-vst3.so
