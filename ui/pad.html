<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Quesynth Pad</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="pad-body rack-editor-closed">

<header id="app-header">
  <div class="brand">Quesynth Pad</div>
  <div class="head-actions">
    <button type="button" id="midi-toggle" class="keys-toggle" data-icon="midi">MIDI</button>
    <button type="button" id="keys-toggle" class="keys-toggle" data-icon="keys"
            aria-expanded="false" aria-controls="keyboard">Keys</button>
    <button type="button" id="write-toggle" class="bank-write" data-icon="write"
            aria-label="Write this sound into a slot">WRITE</button>
    <button type="button" id="config-toggle" class="bank-write" data-icon="config" hidden
            aria-label="Configure the controllers">CONFIG</button>
  </div>
</header>

<div id="surface">
  <!-- One rack, sixteen logical instruments, and one reused synth editor. -->
  <section id="pads" class="pads" data-view="grid" aria-label="Quesynth rack">
    <header class="rack-toolbar">
      <label class="rack-kit-name">
        <span>Kit</span>
        <input id="kit-name" type="text" value="Untitled Kit" maxlength="80" aria-label="Kit name">
      </label>
      <label class="rack-compact">
        <span>Mapping</span>
        <select id="kit-mapping" aria-label="Pad mapping">
          <option value="chromatic">Chromatic 36–51</option>
          <option value="gm">General MIDI</option>
          <option value="custom">Custom</option>
        </select>
      </label>
      <label class="rack-compact">
        <span>Channel</span>
        <select id="kit-channel" aria-label="MIDI channel"><option value="omni">Omni</option></select>
      </label>
      <div class="rack-file-actions" aria-label="Kit file actions">
        <button type="button" class="pad-action" id="kit-new" data-icon="file">NEW</button>
        <button type="button" class="pad-action" id="kit-open" data-icon="open">OPEN</button>
        <button type="button" class="pad-action primary" id="kit-save" data-icon="save">SAVE .QKIT</button>
        <input id="kit-file" type="file" accept=".qkit,application/json" hidden>
      </div>
    </header>

    <!-- At narrow widths the grid and complete inspector are peer views. This
         keeps every existing rack control available without putting either one
         below the viewport. -->
    <div class="rack-views" aria-label="Rack view">
      <button type="button" class="pad-action on" data-rack-view="grid" data-icon="keys" aria-pressed="true">PADS</button>
      <button type="button" class="pad-action" data-rack-view="inspector" data-icon="config" aria-pressed="false">INSPECTOR</button>
    </div>

    <div class="rack-workspace">
      <div class="pad-grid" id="pad-grid" role="grid" aria-label="16 instrument pads"></div>

      <aside class="pad-inspector" aria-labelledby="pad-selected">
        <div class="pad-inspector-head">
          <strong id="pad-selected">01 · Pad 1</strong>
          <button type="button" class="pad-action" id="pad-learn" data-icon="learn">MIDI LEARN</button>
        </div>
        <label class="rack-field wide"><span>Name</span><input id="pad-name" type="text" maxlength="48"></label>
        <div class="rack-fields two">
          <label class="rack-field"><span>Trigger note</span><input id="pad-note" type="number" min="0" max="127"><output id="pad-note-read">C2 · 36</output></label>
          <label class="rack-field"><span>Engine root</span><input id="pad-root" type="number" min="0" max="127"><output id="pad-root-read">C4 · 60</output></label>
          <label class="rack-field"><span>Trigger mode</span><select id="pad-mode"><option value="gate">Gate</option><option value="one-shot">One shot</option></select></label>
          <label class="rack-field"><span>Choke group</span><select id="pad-choke"><option value="0">Off</option></select></label>
        </div>
        <div class="rack-sliders">
          <label class="rack-slider"><span>Velocity</span><input id="pad-velocity" type="range" min="0" max="200" value="100"><output id="pad-velocity-read">100%</output></label>
          <label class="rack-slider"><span>Volume</span><input id="pad-volume" type="range" min="0" max="150" value="100"><output id="pad-volume-read">0.0 dB</output></label>
          <label class="rack-slider"><span>Pan</span><input id="pad-pan" type="range" min="-100" max="100" value="0"><output id="pad-pan-read">Center</output></label>
        </div>
        <div class="rack-toggles" aria-label="Pad state">
          <button type="button" id="pad-enabled" data-icon="enabled" aria-pressed="true">ENABLED</button>
          <button type="button" id="pad-mute" data-icon="mute" aria-pressed="false">MUTE</button>
          <button type="button" id="pad-solo" data-icon="solo" aria-pressed="false">SOLO</button>
        </div>
        <div class="pad-inspector-actions">
          <button type="button" class="pad-action" id="pad-copy" data-icon="copy">COPY SLOT</button>
          <button type="button" class="pad-action" id="pad-paste" data-icon="paste" disabled>PASTE SLOT</button>
          <button type="button" class="pad-action primary" id="pad-edit" data-icon="edit"
                  aria-expanded="false" aria-controls="rack-editor">EDIT SYNTH</button>
        </div>
        <p class="rack-hint" id="rack-hint">Incoming notes select a pad; its root note sets the pitch sent to Quesynth.</p>
      </aside>
    </div>
  </section>

  <!-- The complete shared editor is a drawer over the rack, never page content. -->
  <section class="rack-editor" id="rack-editor" data-mode="drawer"
           aria-label="Selected pad synth editor" hidden>
    <div class="rack-editor-title">
      <span>Sound design</span><strong id="rack-editor-pad">Pad 1</strong>
      <button type="button" class="pad-action" id="rack-editor-close" data-icon="close">CLOSE</button>
    </div>
    <div class="editor-body">
      <nav id="navigator" aria-label="Editor sections"><div class="nav-inner"></div></nav>
      <main id="panels"></main>
    </div>
  </section>
</div>

<div id="bank" class="bank">
  <button type="button" class="bank-step" data-step="-1" data-icon="previous" aria-label="Previous patch">PREV</button>
  <div class="bank-read">
    <span class="bank-origin" id="bank-origin"></span>
    <span class="bank-patch" id="bank-patch">Untitled</span>
    <span class="bank-dirty" id="bank-dirty" role="img" aria-label="Unsaved changes"
          title="Unsaved changes" hidden>*</span>
    <span class="bank-name" id="bank-name"></span>
  </div>
  <button type="button" class="bank-step" data-step="1" data-icon="next" aria-label="Next patch">NEXT</button>
  <div class="bank-actions">
    <button type="button" class="bank-action" id="preset-browse" data-icon="open"
            aria-label="Open the preset browser">Browser</button>
    <button type="button" class="bank-action" id="preset-save" data-icon="save"
            aria-label="Save preset">Save</button>
    <div class="bank-menu">
      <button type="button" class="bank-action" id="preset-menu" data-icon="config"
              aria-haspopup="menu" aria-expanded="false" aria-controls="preset-menu-list"
              aria-label="More preset actions">More</button>
      <div class="bank-menu-list" id="preset-menu-list" role="menu"
           aria-label="Preset actions" hidden>
        <button type="button" role="menuitem" data-action="save-as">Save As...</button>
        <button type="button" role="menuitem" data-action="export-patch">Export patch</button>
        <button type="button" role="menuitem" data-action="export-bank">Export bank</button>
        <button type="button" role="menuitem" data-action="import-bank">Import bank...</button>
        <button type="button" role="menuitem" data-action="write">Write to slot...</button>
      </div>
    </div>
  </div>
  <div class="bank-vol">
    <label for="master-vol">Vol</label>
    <input type="range" id="master-vol" min="0" max="100" value="80"
           aria-label="Master volume">
    <span class="bank-vol-read" id="master-vol-read">80</span>
  </div>
  <div class="bank-notices">
    <!-- What became of the program and bank the host asked this editor to show.
         The strings are the contract (specs, section 3.4); app.js fills in only
         the bank, slot and name. -->
    <div class="restore-banner" id="restore-banner" role="alert" hidden>
      <p class="restore-line restore-ok" id="restore-ok" role="status" hidden>Restored <span class="restore-id" id="restore-ok-id"></span></p>
      <div class="restore-failed" id="restore-failed" hidden>
        <p class="restore-line" id="restore-failed-text">Could not restore <code class="restore-id" id="restore-failed-id"></code>. The current sound was kept.</p>
        <div class="restore-actions">
          <button type="button" id="restore-retry">Retry</button>
          <button type="button" id="restore-choose">Choose bank</button>
          <button type="button" id="restore-dismiss">Dismiss</button>
        </div>
      </div>
      <div class="restore-missing" id="restore-missing" hidden>
        <p class="restore-line">The saved bank is unavailable. Load Factory / Init instead?</p>
        <div class="restore-actions">
          <button type="button" id="restore-factory">Load Factory / Init</button>
          <button type="button" id="restore-keep">Keep current sound</button>
        </div>
      </div>
    </div>
    <!-- Results of Save, Export, Write and Import, and of a host that could not
         keep a bank. Never a dialog: the sound must stay playable while it says so. -->
    <p class="bank-status" id="bank-status" role="status" aria-live="polite" hidden></p>
  </div>
</div>

<section id="keyboard" class="keyboard" hidden aria-label="Keyboard">
  <div class="keys-bar">
    <button type="button" class="oct" data-step="-1" data-icon="down"
            aria-label="Oct down, one octave lower">OCT DOWN</button>
    <span class="oct-label" id="oct-label"></span>
    <button type="button" class="oct" data-step="1" data-icon="up"
            aria-label="Oct up, one octave higher">OCT UP</button>
  </div>
  <div class="keys-row">
    <div class="wheels" id="wheels"></div>
    <div class="keys-scroll" id="keys-scroll"><div class="keys" id="keys"></div></div>
  </div>
</section>

<script src="pad-boot.js"></script>
<script src="host.js" onerror="void 0"></script>
<script src="params.js"></script>
<script src="bank.js" onerror="void 0"></script>
<script src="pad-model.js"></script>
<script src="layout.js"></script>
<script src="bridge.js"></script>
<script src="app.js"></script>
<script src="midi.js"></script>
<script src="sy1.js"></script>
<script src="midimap.js"></script>
<script src="patchfile.js"></script>
<script src="modal.js"></script>
<script src="browser.js"></script>
<script src="options.js"></script>
<script src="pad.js"></script>
</body>
</html>
